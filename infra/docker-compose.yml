services:
  mysql:
    image: mysql:9.0
    container_name: natural_to_sql_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ecommerce
    ports:
      - "3307:3306"
    volumes:
      - ./mysql/seed.sql:/docker-entrypoint-initdb.d/seed.sql:ro
      - ./mysql/create_readonly_user.sql:/docker-entrypoint-initdb.d/create_readonly_user.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD:-rootpassword} || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
