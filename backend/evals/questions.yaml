# Evaluation benchmark dataset for natural-to-sql
# Contains 32 diverse queries across aggregations, joins, date calculations, subqueries, and top-n ranking.

- id: agg_01
  question: "What is the total number of users?"
  reference_sql: "SELECT COUNT(*) AS total_users FROM users;"
  order_matters: false
  tags: ["aggregation"]

- id: agg_02
  question: "What is the average price of all active products?"
  reference_sql: "SELECT AVG(price) AS avg_price FROM products WHERE status = 'active';"
  order_matters: false
  tags: ["aggregation", "filter"]

- id: agg_03
  question: "What is the total revenue from completed orders?"
  reference_sql: "SELECT SUM(total_amount) AS total_revenue FROM orders WHERE status = 'completed';"
  order_matters: false
  tags: ["aggregation", "filter"]

- id: agg_04
  question: "How many active products have a stock quantity greater than 50?"
  reference_sql: "SELECT COUNT(*) AS total_products FROM products WHERE status = 'active' AND stock_quantity > 50;"
  order_matters: false
  tags: ["aggregation", "filter"]

- id: topn_01
  question: "What are the top 5 most expensive products?"
  reference_sql: "SELECT id, name, price FROM products ORDER BY price DESC LIMIT 5;"
  order_matters: true
  tags: ["top-n", "sorting"]

- id: topn_02
  question: "Show the top 3 users who have spent the most total money on completed orders."
  reference_sql: "SELECT u.id, u.name, SUM(o.total_amount) AS total_spent FROM users u JOIN orders o ON u.id = o.user_id WHERE o.status = 'completed' GROUP BY u.id, u.name ORDER BY total_spent DESC LIMIT 3;"
  order_matters: true
  tags: ["top-n", "join", "aggregation"]

- id: topn_03
  question: "List the top 5 bestselling products by total quantity sold."
  reference_sql: "SELECT p.id, p.name, SUM(oi.quantity) AS total_sold FROM products p JOIN order_items oi ON p.id = oi.product_id GROUP BY p.id, p.name ORDER BY total_sold DESC LIMIT 5;"
  order_matters: true
  tags: ["top-n", "join", "aggregation"]

- id: topn_04
  question: "Show the 10 most recent orders (id, user_id, status, total_amount, created_at)."
  reference_sql: "SELECT id, user_id, status, total_amount, created_at FROM orders ORDER BY created_at DESC LIMIT 10;"
  order_matters: true
  tags: ["top-n", "sorting", "date"]

- id: join_01
  question: "List the names of all categories along with the count of products in each category."
  reference_sql: "SELECT c.name, COUNT(p.id) AS product_count FROM categories c LEFT JOIN products p ON c.id = p.category_id GROUP BY c.id, c.name;"
  order_matters: false
  tags: ["join", "group-by"]

- id: join_02
  question: "Show the user name, order ID, and total amount for the first 20 orders with status 'shipped' ordered by order ID."
  reference_sql: "SELECT u.name, o.id AS order_id, o.total_amount FROM orders o JOIN users u ON o.user_id = u.id WHERE o.status = 'shipped' ORDER BY o.id LIMIT 20;"
  order_matters: true
  tags: ["join", "filter"]

- id: join_03
  question: "For order ID 1, list the product names, quantities, and total prices."
  reference_sql: "SELECT p.name, oi.quantity, oi.total_price FROM order_items oi JOIN products p ON oi.product_id = p.id WHERE oi.order_id = 1;"
  order_matters: false
  tags: ["join", "filter"]

- id: join_04
  question: "List the order ID, user email, payment method, and payment status for the first 20 payments ordered by payment ID."
  reference_sql: "SELECT p.order_id, u.email, p.payment_method, p.status FROM payments p JOIN orders o ON p.order_id = o.id JOIN users u ON o.user_id = u.id ORDER BY p.id LIMIT 20;"
  order_matters: true
  tags: ["multi-join"]

- id: group_01
  question: "How many users are registered in each country across all user statuses?"
  reference_sql: "SELECT country, COUNT(*) AS user_count FROM users GROUP BY country;"
  order_matters: false
  tags: ["group-by", "aggregation"]

- id: group_02
  question: "What is the all-time total revenue for each order status?"
  reference_sql: "SELECT status, SUM(total_amount) AS total_revenue FROM orders GROUP BY status;"
  order_matters: false
  tags: ["group-by", "aggregation"]

- id: group_03
  question: "Show the total quantity and revenue generated by each product category."
  reference_sql: "SELECT c.name AS category_name, SUM(oi.quantity) AS total_quantity, SUM(oi.total_price) AS total_revenue FROM categories c JOIN products p ON c.id = p.category_id JOIN order_items oi ON p.id = oi.product_id GROUP BY c.id, c.name;"
  order_matters: false
  tags: ["multi-join", "group-by"]

- id: having_01
  question: "Which product categories have more than 5 products? List the category name and product count."
  reference_sql: "SELECT c.name, COUNT(p.id) AS product_count FROM categories c JOIN products p ON c.id = p.category_id GROUP BY c.id, c.name HAVING COUNT(p.id) > 5;"
  order_matters: false
  tags: ["group-by", "having"]

- id: having_02
  question: "List the top 5 users with the most completed orders."
  reference_sql: "SELECT u.id, u.name, COUNT(o.id) AS order_count FROM users u JOIN orders o ON u.id = o.user_id WHERE o.status = 'completed' GROUP BY u.id, u.name ORDER BY order_count DESC LIMIT 5;"
  order_matters: true
  tags: ["join", "group-by", "top-n"]

- id: having_03
  question: "Which cities have at least 2 active users? List the city and active user count."
  reference_sql: "SELECT city, COUNT(*) AS active_users FROM users WHERE status = 'active' GROUP BY city HAVING COUNT(*) >= 2;"
  order_matters: false
  tags: ["group-by", "having", "filter"]

- id: date_01
  question: "What was the total order revenue from completed and shipped orders in the year 2024?"
  reference_sql: "SELECT SUM(total_amount) AS total_revenue FROM orders WHERE created_at >= '2024-01-01' AND created_at < '2025-01-01' AND status IN ('completed', 'shipped');"
  order_matters: false
  tags: ["date", "aggregation"]

- id: date_02
  question: "How many orders were placed each month in 2024?"
  reference_sql: "SELECT DATE_FORMAT(created_at, '%Y-%m') AS month, COUNT(*) AS order_count FROM orders WHERE created_at >= '2024-01-01' AND created_at < '2025-01-01' GROUP BY DATE_FORMAT(created_at, '%Y-%m') ORDER BY month;"
  order_matters: true
  tags: ["date", "group-by", "sorting"]

- id: date_03
  question: "List the order ID, user ID, total amount, and created date for the first 20 orders placed after June 1, 2024 with a total amount greater than 200 ordered by order ID."
  reference_sql: "SELECT id, user_id, total_amount, created_at FROM orders WHERE created_at > '2024-06-01' AND total_amount > 200 ORDER BY id LIMIT 20;"
  order_matters: true
  tags: ["date", "filter"]

- id: subq_01
  question: "Which products have never been ordered?"
  reference_sql: "SELECT id, name FROM products WHERE id NOT IN (SELECT DISTINCT product_id FROM order_items);"
  order_matters: false
  tags: ["subquery", "anti-join"]

- id: subq_02
  question: "Find all users who have never placed an order."
  reference_sql: "SELECT id, name, email FROM users WHERE id NOT IN (SELECT DISTINCT user_id FROM orders);"
  order_matters: false
  tags: ["subquery", "anti-join"]

- id: subq_03
  question: "List products whose price is higher than the average price of all products."
  reference_sql: "SELECT id, name, price FROM products WHERE price > (SELECT AVG(price) FROM products);"
  order_matters: false
  tags: ["subquery", "filter"]

- id: payment_01
  question: "What is the total amount collected by each payment method for completed payments?"
  reference_sql: "SELECT payment_method, SUM(amount) AS total_collected FROM payments WHERE status = 'completed' GROUP BY payment_method;"
  order_matters: false
  tags: ["group-by", "aggregation"]

- id: payment_02
  question: "How many failed payments occurred across all orders?"
  reference_sql: "SELECT COUNT(*) AS failed_count FROM payments WHERE status = 'failed';"
  order_matters: false
  tags: ["aggregation", "filter"]

- id: complex_01
  question: "What is the average order value for users in the USA?"
  reference_sql: "SELECT AVG(o.total_amount) AS avg_order_val FROM orders o JOIN users u ON o.user_id = u.id WHERE u.country = 'USA';"
  order_matters: false
  tags: ["join", "aggregation"]

- id: complex_02
  question: "Find the product that generated the single highest total revenue from completed and shipped orders."
  reference_sql: "SELECT p.id, p.name, SUM(oi.total_price) AS total_revenue FROM products p JOIN order_items oi ON p.id = oi.product_id JOIN orders o ON oi.order_id = o.id WHERE o.status IN ('completed', 'shipped') GROUP BY p.id, p.name ORDER BY total_revenue DESC LIMIT 1;"
  order_matters: true
  tags: ["top-n", "join", "aggregation"]

- id: complex_03
  question: "List the top 10 users by total spent on completed orders with their completed order count."
  reference_sql: "SELECT u.id, u.name, COUNT(o.id) AS completed_orders, SUM(o.total_amount) AS total_spent FROM users u JOIN orders o ON u.id = o.user_id WHERE o.status = 'completed' GROUP BY u.id, u.name ORDER BY total_spent DESC LIMIT 10;"
  order_matters: true
  tags: ["join", "group-by", "top-n"]

- id: filter_01
  question: "List the ID, name, and email of all active users from the city 'Nashville'."
  reference_sql: "SELECT id, name, email FROM users WHERE status = 'active' AND city = 'Nashville';"
  order_matters: false
  tags: ["filter"]

- id: filter_02
  question: "Show the ID, name, SKU, and stock quantity of all products that are currently out of stock."
  reference_sql: "SELECT id, name, sku, stock_quantity FROM products WHERE status = 'out_of_stock' OR stock_quantity = 0;"
  order_matters: false
  tags: ["filter"]

- id: filter_03
  question: "Find the total quantity of items sold for category 'Electronics'."
  reference_sql: "SELECT SUM(oi.quantity) AS total_sold FROM order_items oi JOIN products p ON oi.product_id = p.id JOIN categories c ON p.category_id = c.id WHERE c.name = 'Electronics';"
  order_matters: false
  tags: ["multi-join", "aggregation"]
