# Safe SQL corpus for natural-to-sql validator
# Every query in this file MUST pass validation and re-render successfully.

safe_queries:
  # Simple SELECTs
  - name: select_all_users
    sql: "SELECT * FROM users"
  - name: select_user_columns
    sql: "SELECT id, name, email, city FROM users WHERE status = 'active'"
  - name: select_products_price_filter
    sql: "SELECT id, name, price FROM products WHERE price > 50.00"
  - name: select_categories
    sql: "SELECT id, name, description FROM categories ORDER BY name ASC"
  - name: select_orders_by_status
    sql: "SELECT id, total_amount, created_at FROM orders WHERE status = 'completed'"
  - name: select_payments_by_method
    sql: "SELECT * FROM payments WHERE payment_method = 'credit_card' AND status = 'completed'"

  # Joins
  - name: join_products_categories
    sql: "SELECT p.id, p.name, c.name AS category_name, p.price FROM products p JOIN categories c ON p.category_id = c.id"
  - name: join_users_orders
    sql: "SELECT u.name, o.id AS order_id, o.total_amount FROM users u JOIN orders o ON u.id = o.user_id"
  - name: join_orders_items_products
    sql: "SELECT o.id, oi.quantity, p.name, oi.unit_price FROM orders o JOIN order_items oi ON o.id = oi.order_id JOIN products p ON oi.product_id = p.id"
  - name: left_join_unsold_products
    sql: "SELECT p.id, p.name FROM products p LEFT JOIN order_items oi ON p.id = oi.product_id WHERE oi.id IS NULL"
  - name: full_ecommerce_join
    sql: "SELECT u.name, o.id, p.name AS product_name, pay.amount FROM users u JOIN orders o ON u.id = o.user_id JOIN order_items oi ON o.id = oi.order_id JOIN products p ON oi.product_id = p.id JOIN payments pay ON o.id = pay.order_id"

  # Aggregations & Group By
  - name: count_users_by_status
    sql: "SELECT status, COUNT(*) AS count FROM users GROUP BY status"
  - name: revenue_by_category
    sql: "SELECT c.name, SUM(oi.total_price) AS total_revenue FROM categories c JOIN products p ON c.id = p.category_id JOIN order_items oi ON p.id = oi.product_id GROUP BY c.name"
  - name: top_10_users_by_revenue
    sql: "SELECT u.id, u.name, SUM(o.total_amount) AS revenue FROM users u JOIN orders o ON u.id = o.user_id WHERE o.status IN ('completed', 'shipped') GROUP BY u.id, u.name ORDER BY revenue DESC LIMIT 10"
  - name: avg_order_amount
    sql: "SELECT AVG(total_amount) AS avg_amount, MIN(total_amount) AS min_amount, MAX(total_amount) AS max_amount FROM orders"
  - name: orders_having_high_total
    sql: "SELECT user_id, COUNT(*) AS num_orders, SUM(total_amount) AS total_spent FROM orders GROUP BY user_id HAVING total_spent > 1000"
  - name: count_distinct_cities
    sql: "SELECT COUNT(DISTINCT city) AS unique_cities FROM users"

  # Date and Time Functions
  - name: orders_by_year
    sql: "SELECT YEAR(created_at) AS order_year, COUNT(*) AS total_orders FROM orders GROUP BY YEAR(created_at)"
  - name: monthly_revenue_2025
    sql: "SELECT DATE_FORMAT(created_at, '%Y-%m') AS month, SUM(total_amount) AS revenue FROM orders WHERE created_at >= '2025-01-01' AND created_at < '2026-01-01' GROUP BY month ORDER BY month"
  - name: orders_recent_now
    sql: "SELECT * FROM orders WHERE created_at >= NOW() - INTERVAL 30 DAY"
  - name: datediff_order_analysis
    sql: "SELECT id, DATEDIFF(NOW(), created_at) AS days_ago FROM orders LIMIT 25"
  - name: curdate_filter
    sql: "SELECT * FROM orders WHERE created_at <= CURDATE()"

  # String Functions & Conditionals
  - name: concat_user_info
    sql: "SELECT CONCAT(name, ' <', email, '>') AS contact_card FROM users"
  - name: case_when_order_tier
    sql: "SELECT id, total_amount, CASE WHEN total_amount >= 500 THEN 'high' WHEN total_amount >= 100 THEN 'medium' ELSE 'low' END AS tier FROM orders"
  - name: coalesce_description
    sql: "SELECT id, name, COALESCE(description, 'No description') AS desc_clean FROM categories"
  - name: lower_upper_city
    sql: "SELECT UPPER(city) AS city_upper, LOWER(country) AS country_lower FROM users"
  - name: like_email_domain
    sql: "SELECT id, email FROM users WHERE email LIKE '%@example.com'"

  # Subqueries
  - name: subquery_in_where
    sql: "SELECT * FROM users WHERE id IN (SELECT user_id FROM orders WHERE total_amount > 500)"
  - name: subquery_not_in
    sql: "SELECT id, name FROM products WHERE id NOT IN (SELECT product_id FROM order_items)"
  - name: subquery_exists
    sql: "SELECT u.name FROM users u WHERE EXISTS (SELECT 1 FROM orders o WHERE o.user_id = u.id AND o.status = 'completed')"
  - name: scalar_subquery_select
    sql: "SELECT u.name, (SELECT COUNT(*) FROM orders o WHERE o.user_id = u.id) AS order_count FROM users u"

  # Common Table Expressions (CTEs)
  - name: cte_user_spending
    sql: "WITH user_spend AS (SELECT user_id, SUM(total_amount) AS total FROM orders GROUP BY user_id) SELECT u.name, s.total FROM users u JOIN user_spend s ON u.id = s.user_id WHERE s.total > 500"
  - name: cte_multi_stage
    sql: "WITH active_users AS (SELECT id, name FROM users WHERE status = 'active'), completed_orders AS (SELECT id, user_id, total_amount FROM orders WHERE status = 'completed') SELECT au.name, co.total_amount FROM active_users au JOIN completed_orders co ON au.id = co.user_id"
  - name: cte_category_stats
    sql: "WITH cat_counts AS (SELECT category_id, COUNT(*) AS prod_count FROM products GROUP BY category_id) SELECT c.name, cc.prod_count FROM categories c JOIN cat_counts cc ON c.id = cc.category_id"

  # Set Operations
  - name: union_distinct_cities
    sql: "SELECT city FROM users WHERE country = 'USA' UNION SELECT city FROM users WHERE country = 'Canada'"
  - name: union_all_order_ids
    sql: "SELECT id, 'order' AS type FROM orders WHERE status = 'completed' UNION ALL SELECT id, 'payment' AS type FROM payments WHERE status = 'completed'"

  # Window Functions
  - name: window_row_number_top_products
    sql: "SELECT id, name, category_id, price, ROW_NUMBER() OVER (PARTITION BY category_id ORDER BY price DESC) AS rank_in_cat FROM products"
  - name: window_dense_rank
    sql: "SELECT id, total_amount, DENSE_RANK() OVER (ORDER BY total_amount DESC) AS spend_rank FROM orders"

  # Filtering with BETWEEN and IN
  - name: between_prices
    sql: "SELECT id, name, price FROM products WHERE price BETWEEN 20.00 AND 100.00"
  - name: in_payment_statuses
    sql: "SELECT id, amount, status FROM payments WHERE status IN ('completed', 'refunded', 'pending')"
  - name: null_check
    sql: "SELECT id, name FROM categories WHERE description IS NOT NULL"

  # Outer LIMIT variations
  - name: explicit_small_limit
    sql: "SELECT id, name FROM users LIMIT 15"
  - name: limit_with_offset
    sql: "SELECT id, total_amount FROM orders ORDER BY id ASC LIMIT 20 OFFSET 40"
  - name: large_limit_to_cap
    sql: "SELECT id, name FROM products LIMIT 2000"

  # --- review 2026-09-29 ---
  - name: typed_func_arg_named_like_denied_function
    sql: "WITH x AS (SELECT quantity AS sleep FROM order_items) SELECT SUM(sleep) FROM x"
  - name: chained_ctes
    sql: "WITH a AS (SELECT id FROM users), b AS (SELECT a.id FROM a) SELECT COUNT(*) FROM b"
  - name: recursive_cte
    sql: "WITH RECURSIVE n AS (SELECT 1 AS i UNION ALL SELECT i + 1 FROM n WHERE i < 5) SELECT i FROM n"
